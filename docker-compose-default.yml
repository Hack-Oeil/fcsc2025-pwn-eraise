services:
  eraise:
    image: anssi/fcsc2025-pwn-eraise:latest
    environment:
      - HOOS_CTF_EMAIL=${HOOS_CTF_EMAIL:-}
      - HOOS_CTF_USERNAME=${HOOS_CTF_USERNAME:-}
      - LANGUAGE=${LANGUAGE:-fr}
    labels:
      ho.ctf.cyrhades: "challenge"
    ports:
      - ${PORT}:4000

  shovel-webapp:
    image: anssi/fcsc2025-pwn-eraise-shovel:latest
    ports:
      - ${PORT}:8000
